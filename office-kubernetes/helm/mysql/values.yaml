ps-db:
  mysql:
    clusterType: async
    size: 1
    configuration: |
      max_connections=250
    resources:
      requests:
        memory: 1Gi
      limits:
        memory: 2Gi

    expose:
      enabled: false

    exposePrimary:
      enabled: false

    volumeSpec:
      pvc:
        storageClassName: freenas-iscsi-csi
        resources:
          requests:
            storage: 3Gi
    
    gracePeriod: 600

  proxy:
    haproxy:
      enabled: true
      image:
        repository: percona/haproxy
        tag: 2.8.18-1
      imagePullPolicy: Always
      podDisruptionBudget:
        maxUnavailable: 1

      size: 2

      resources:
        requests:
          memory: "100"
          cpu: 200m
        limits: {}

    router:
      enabled: false

  orchestrator:
    enabled: true

  pmm:
    enabled: false
    image:
      repository: percona/pmm-client
      tag: 3.7.0
    imagePullPolicy: Always
  #  readinessProbe:
  #    initialDelaySeconds: 15
  #    timeoutSeconds: 15
  #    periodSeconds: 30
  #    successThreshold: 1
  #    failureThreshold: 5
  #  livenessProbe:
  #    initialDelaySeconds: 300
  #    timeoutSeconds: 5
  #    periodSeconds: 10
  #    successThreshold: 1
  #    failureThreshold: 3
    serverHost: monitoring-service
    # mysqlParams: "--disable-tablestats-limit=2000"
    resources:
      requests:
        memory: 150M
        cpu: 300m
      limits: {}

