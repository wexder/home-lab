apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-psql
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 18
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 50Gi
      storageClassName: freenas-iscsi-csi
  postgresql:
    extensions:
      - name: vectorchord
        image:
          reference: ghcr.io/tensorchord/cloudnative-vectorchord:18.1
  managed:
    roles:
    - name: immich
      ensure: present
      createdb: true
      login: true
      passwordSecret:
        name: immich-postgres-user
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: main-psql-pool
spec:
  cluster:
    name: main-psql

  instances: 1
  type: rw
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "10"
